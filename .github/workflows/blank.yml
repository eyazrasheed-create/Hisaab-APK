name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install packages
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build web app for APK (offline, without PWA)
        run: |
          cat > vite.apk.config.ts <<'EOF'
          import tailwindcss from '@tailwindcss/vite';
          import react from '@vitejs/plugin-react';
          import path from 'path';
          import { defineConfig } from 'vite';

          export default defineConfig({
            base: './',
            plugins: [react(), tailwindcss()],
            resolve: { alias: { '@': path.resolve('.') } },
          });
          EOF
          npx vite build --config vite.apk.config.ts

      - name: Copy web app into APK
        run: |
          rm -rf app/src/main/assets
          mkdir -p app/src/main/assets
          cp -r dist/. app/src/main/assets/
          rm -f app/src/main/assets/rozana-hisaab-mobile.html
          ls app/src/main/assets

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: EasyKhataBook-APK
          path: app/build/outputs/apk/debug/*.apk
