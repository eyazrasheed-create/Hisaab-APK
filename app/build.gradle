plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rozana.hisaab'
    compileSdk 35

    defaultConfig {
        applicationId "com.rozana.hisaab"
        minSdk 24
        targetSdk 35
        versionCode 4
        versionName "4.0"
    }

    // Har build ek hi key se sign ho, taake nayi APK purani ke upar install ho aur data na mitay
    signingConfigs {
        fixed {
            storeFile file('rozana-hisaab.keystore')
            storePassword 'rozana123'
            keyAlias 'rozana'
            keyPassword 'rozana123'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fixed
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}
