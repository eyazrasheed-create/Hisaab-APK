plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rozana.hisaab'
    compileSdk 35

    defaultConfig {
        applicationId "com.rozana.hisaab"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Debug key se sign hoti hai taake APK seedha phone par install ho sake.
            // Play Store ke liye: Build > Generate Signed Bundle / APK istemal karein.
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
